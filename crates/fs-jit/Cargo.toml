[package]
name = "fs-jit"
edition.workspace = true
version.workspace = true
license.workspace = true

# Stage 0 of docs/jit.md: a PA-keyed, direct-mapped, golden-tier threaded-code (decoded-`Inst`)
# cache (`lib.rs`'s `BlockCache`) — zero unsafe. Stage 1 / Phase 1 of
# `docs/jit-scalar-design.md` (`chain.rs`'s `ChainCache`) adds native x86-64 codegen, which needs a
# real executable (W^X) arena and a raw fn-pointer call: that unsafe surface is isolated to
# `sys.rs` alone, mirroring `fs-hostmem`'s convention (`emit.rs`/`chain.rs` keep their own
# module-level `#![forbid(unsafe_code)]`; see `lib.rs`'s module doc). No blanket
# `unsafe_code = "forbid"` lint at the crate level anymore, since that cannot be locally overridden
# for `sys.rs` (that's the whole point of `forbid` vs `deny`).
[dependencies]
fs-mmu = { path = "../fs-mmu" }
fs-riscv = { path = "../fs-riscv" }
libc = "0.2"

# Test-only: Phase 2's CLINT-store early-exit differential test needs a real CLINT-bearing `Bus`
# (`fs_platform::Machine`), not just the plain `fs_mmu::Mmu` production code uses. `fs-platform`
# does not depend on `fs-jit`, so this adds no cycle; it is not a production dependency of this
# crate (see `lib.rs`'s module doc — `fs-jit` still only depends on `fs-mmu`+`fs-riscv` at runtime).
[dev-dependencies]
fs-platform = { path = "../fs-platform" }
